# ==============================================================================
# Nginx Reverse Proxy Configuration for AI Provider Hub
# Replace 'your-domain.com' with your actual domain or VPS IP
# ==============================================================================

server {
    listen 80;
    server_name ai-provider.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Connection Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE) and fast streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for long AI streaming generations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

