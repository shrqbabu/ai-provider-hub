name: analytics-agent

on:
  push:
    paths:
      - 'analytics-agent/**'
      - '.github/workflows/analytics-agent.yml'
  pull_request:
    paths:
      - 'analytics-agent/**'
      - '.github/workflows/analytics-agent.yml'
  workflow_dispatch:

concurrency:
  group: analytics-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-agent/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            analytics-agent/backend/requirements.txt
            analytics-agent/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the analytics test suite
        env:
          MPLBACKEND: Agg
          LLM_PROVIDER: deterministic
        run: pytest tests/ -q

  android:
    name: Android (unit tests + assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-agent/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          build-root-directory: analytics-agent/android

      - name: Write build configuration
        # Only PUBLIC values reach the APK. No service-role key, database
        # password or AI provider key is ever available to this job.
        run: |
          cat > local.defaults.properties <<'EOF'
          SUPABASE_URL=${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          ANALYTICS_API_URL=${{ vars.ANALYTICS_API_URL }}
          EOF

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug
        continue-on-error: true

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: analytics-agent-debug-apk
          path: analytics-agent/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: analytics-agent/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  secret-scan:
    name: No secrets in the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a privileged key name appears in Android sources
        run: |
          set -e
          # These names must never exist anywhere in the shipped app source.
          PATTERN='SERVICE_ROLE|service_role|OPENAI_API_KEY|GEMINI_API_KEY|SUPABASE_JWT_SECRET|POSTGRES_PASSWORD|DATABASE_URL'
          if grep -rInE "$PATTERN" analytics-agent/android/app/src/main \
               --include='*.kt' --include='*.xml' --include='*.properties' ; then
            echo "::error::A privileged credential name was found in the Android app sources."
            exit 1
          fi
          echo "No privileged credential names found in the Android app."

      - name: Fail if out-of-scope Power BI outputs are referenced
        run: |
          set -e
          if grep -rInE '\.pbix|\.pbit' analytics-agent/backend/app analytics-agent/android/app/src/main ; then
            echo "::error::PBIX/PBIT generation is explicitly out of scope."
            exit 1
          fi
          echo "No PBIX/PBIT references found."
